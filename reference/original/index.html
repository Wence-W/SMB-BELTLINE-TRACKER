<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>SMB Beltline Tracker</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("colorTheme");
          if (t) document.documentElement.setAttribute("data-color-theme", t);
          var ai = localStorage.getItem("animationIntensity");
          if (ai)
            document.documentElement.setAttribute(
              "data-animation-intensity",
              ai,
            );
          var m = localStorage.getItem("theme");
          if (
            m === "dark" ||
            (!m && window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
